# NOTE: values below are base64-encoded, NOT encrypted. This is fine for
# local practice; in a real cluster use sealed-secrets / external-secrets
# / SOPS instead of committing plain Secret manifests.
#
# echo -n 'root' | base64        -> cm9vdA==
# echo -n 'rootpassword' | base64 -> cm9vdHBhc3N3b3Jk
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3N3b3Jk
  MYSQL_USER: cm9vdA==
  MYSQL_PASSWORD: cm9vdHBhc3N3b3Jk
